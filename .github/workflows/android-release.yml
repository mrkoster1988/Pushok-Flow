name: Android release with in-app updates

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'pubspec.yaml'

permissions:
  contents: read

concurrency:
  group: pushok-flow-android-release
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'mrkoster1988/Pushok-Flow' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact main commit and version consistency
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 - <<'PY'
          import re
          from pathlib import Path
          manifest = Path('pubspec.yaml').read_text()
          match = re.search(r'(?m)^version:\s*(\d+\.\d+\.\d+)\+(\d+)\s*$', manifest)
          if not match:
              raise SystemExit('Missing valid Flutter release version')
          name, code = match.group(1), int(match.group(2))
          constants = Path('lib/models/app_version.dart').read_text()
          if ("const appVersionName = '" + name + "';") not in constants or (
                  'const appVersionCode = ' + str(code) + ';') not in constants:
              raise SystemExit('Flutter and native version metadata disagree')
          print('Version ready for signed release:', name, code)
          PY
      - name: Resolve release version and refuse existing tags
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p release-diagnostics dist
          python3 - <<'PY'
          import json, os, sys, urllib.error, urllib.request
          from pathlib import Path
          sys.path.insert(0, 'tools')
          from verify_release_apk import read_version
          version, code = read_version(Path('pubspec.yaml'))
          tag = f'v{version}'
          repo = os.environ['GITHUB_REPOSITORY']
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                     'Accept': 'application/vnd.github+json',
                     'X-GitHub-Api-Version': '2022-11-28'}
          for resource in (f'/releases/tags/{tag}', f'/git/ref/tags/{tag}'):
              request = urllib.request.Request(f'https://api.github.com/repos/{repo}{resource}', headers=headers)
              try:
                  with urllib.request.urlopen(request, timeout=30):
                      pass
              except urllib.error.HTTPError as error:
                  if error.code == 404:
                      continue
                  raise SystemExit(f'Release preflight failed: GitHub HTTP {error.code}')
              raise SystemExit(f'{tag} already exists. Refusing to overwrite a release or tag; inspect an unfinished draft or increase the version.')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'name={version}\ncode={code}\ntag={tag}\napk=Pushok-Flow-v{version}.apk\n')
          PY
      - name: Source checks
        run: python3 -m unittest discover -s tests -v
      - name: Generate Android project
        run: |
          set -o pipefail
          bash tools/bootstrap_android.sh 2>&1 | tee release-diagnostics/bootstrap.log
      - name: Install Flutter dependencies
        run: |
          set -euo pipefail
          flutter pub get --enforce-lockfile
          git diff --exit-code -- pubspec.lock
      - name: Preserve resolved Dart dependencies
        run: python3 tools/capture_dart_dependencies.py --output release-diagnostics/dart-dependencies
      - name: Install pinned Kotlin CLI
        run: |
          set -euo pipefail
          KOTLIN_VERSION=2.2.21
          curl --fail --location --retry 3 \
            "https://github.com/JetBrains/kotlin/releases/download/v${KOTLIN_VERSION}/kotlin-compiler-${KOTLIN_VERSION}.zip" \
            --output /tmp/pushok-kotlin.zip
          mkdir -p "$RUNNER_TEMP/pushok-kotlin"
          unzip -q /tmp/pushok-kotlin.zip -d "$RUNNER_TEMP/pushok-kotlin"
          echo "$RUNNER_TEMP/pushok-kotlin/kotlinc/bin" >> "$GITHUB_PATH"
      - name: Validate Kotlin routing and update rules
        run: bash tools/check_kotlin_routing.sh
      - name: Flutter static analysis
        run: |
          set -o pipefail
          flutter analyze lib test --no-pub 2>&1 | tee release-diagnostics/flutter-analyze.log
      - name: Flutter tests
        run: |
          set -o pipefail
          flutter test --reporter expanded --no-pub 2>&1 | tee release-diagnostics/flutter-test.log
      - name: Validate app manifest
        run: python3 tools/check_android_manifest.py
      - name: Configure persistent private release signing
        env:
          PUSHOK_ANDROID_KEYSTORE_BASE64: ${{ secrets.PUSHOK_ANDROID_KEYSTORE_BASE64 }}
          PUSHOK_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.PUSHOK_ANDROID_KEYSTORE_PASSWORD }}
          PUSHOK_ANDROID_KEY_ALIAS: ${{ secrets.PUSHOK_ANDROID_KEY_ALIAS }}
          PUSHOK_ANDROID_KEY_PASSWORD: ${{ secrets.PUSHOK_ANDROID_KEY_PASSWORD }}
        run: python3 tools/configure_android_signing.py
      - name: Build signed release APK
        env:
          PUSHOK_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.PUSHOK_ANDROID_KEYSTORE_PASSWORD }}
          PUSHOK_ANDROID_KEY_ALIAS: ${{ secrets.PUSHOK_ANDROID_KEY_ALIAS }}
          PUSHOK_ANDROID_KEY_PASSWORD: ${{ secrets.PUSHOK_ANDROID_KEY_PASSWORD }}
        run: |
          set -o pipefail
          flutter build apk --release --no-pub 2>&1 | tee release-diagnostics/flutter-build.log
      - name: Verify release APK and signing certificate
        run: |
          set -o pipefail
          python3 tools/verify_release_apk.py build/app/outputs/flutter-apk/app-release.apk \
            --output dist/verified-release.json 2>&1 | tee release-diagnostics/apk-validation.log
          python3 tools/create_update_manifest.py \
            --apk build/app/outputs/flutter-apk/app-release.apk \
            --verified dist/verified-release.json --output dist
      - name: Preserve verified release artifacts before publishing
        uses: actions/upload-artifact@v4
        with:
          name: pushok-flow-release-apk
          path: dist/
          if-no-files-found: error
          retention-days: 30
      - name: Verify update channel continuity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, re, sys, urllib.error, urllib.request
          from pathlib import Path
          sys.path.insert(0, 'tools')
          from create_update_manifest import validate_previous_manifest
          current = json.loads(Path('dist/update.json').read_text())
          repo = os.environ['GITHUB_REPOSITORY']
          request = urllib.request.Request(f'https://api.github.com/repos/{repo}/releases/latest',
              headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                       'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'})
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  latest = json.load(response)
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise SystemExit(f'Cannot check existing release: GitHub HTTP {error.code}')
              print('First persistent release: no previous latest channel.')
              raise SystemExit(0)
          tag = latest.get('tag_name', '')
          if not re.fullmatch(r'v\d+\.\d+\.\d+', tag):
              raise SystemExit('Unexpected existing latest release tag; inspect before publishing.')
          assets = [a for a in latest.get('assets', []) if a['name'] == 'update.json']
          expected = f'https://github.com/{repo}/releases/download/{tag}/update.json'
          if len(assets) != 1 or assets[0].get('browser_download_url') != expected:
              raise SystemExit('Existing release has no trusted update.json; inspect before publishing.')
          with urllib.request.urlopen(expected, timeout=30) as response:
              payload = response.read(65537)
          if len(payload) > 65536:
              raise SystemExit('Existing update metadata is too large.')
          validate_previous_manifest(current, json.loads(payload))
          print('VersionCode increases and the persistent signing certificate is unchanged.')
          PY
      - name: Publish complete release without replacing existing versions
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_VERSION: ${{ steps.version.outputs.name }}
          RELEASE_APK: ${{ steps.version.outputs.apk }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          manifest = json.loads(Path('dist/update.json').read_text())
          source = os.environ['GITHUB_SHA']
          notes = (
              f"Pushok Flow {manifest['versionName']} ({manifest['versionCode']}).\n\n"
              "Постоянная подпись и обновления через «Профиль → Версия и обновления». "
              "Следующие версии устанавливаются поверх приложения с сохранением локальных данных.\n\n"
              "Переход с прежних debug APK требует однократной переустановки; "
              "сначала сохраните исходную WireGuard-конфигурацию вне приложения.\n\n"
              f"Исходники: https://github.com/{os.environ['GITHUB_REPOSITORY']}/commit/{source}\n\n"
              f"SHA-256 APK: `{manifest['sha256']}`\n\n"
              f"SHA-256 сертификата: `{manifest['certificateSha256']}`\n\n"
              "CI подтверждает сборку и подпись. Реальное VPN-подключение и маршруты требуют испытания на устройстве.\n"
          )
          Path('release-diagnostics/release-notes.md').write_text(notes, encoding='utf-8')
          PY
          # A draft release need not create its tag until publication. Create a
          # new lightweight ref explicitly; POST fails if another writer won.
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/tags/$RELEASE_TAG" -f sha="$GITHUB_SHA" > release-diagnostics/tag.json
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          tag = json.loads(Path('release-diagnostics/tag.json').read_text())
          if tag.get('object', {}).get('type') != 'commit' or tag['object']['sha'] != os.environ['GITHUB_SHA']:
              raise SystemExit('New release tag does not point at the exact built commit.')
          PY
          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --verify-tag --title "Pushok Flow $RELEASE_VERSION" \
            --notes-file release-diagnostics/release-notes.md --draft
          gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            "dist/$RELEASE_APK" "dist/$RELEASE_APK.sha256" dist/update.json
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > release-diagnostics/release-draft.json
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          release = json.loads(Path('release-diagnostics/release-draft.json').read_text())
          expected = [os.environ['RELEASE_APK'], os.environ['RELEASE_APK'] + '.sha256', 'update.json']
          assets = release.get('assets', [])
          if sorted(a['name'] for a in assets) != sorted(expected):
              raise SystemExit('Release assets are incomplete; leaving draft unpublished.')
          for asset in assets:
              local = Path('dist') / asset['name']
              with local.open('rb') as source:
                  digest = 'sha256:' + hashlib.file_digest(source, 'sha256').hexdigest()
              if asset.get('size') != local.stat().st_size or asset.get('digest') != digest:
                  raise SystemExit('Release asset bytes were not confirmed; leaving draft unpublished.')
          PY
          gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" > release-diagnostics/tag-before-publish.json
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          tag = json.loads(Path('release-diagnostics/tag-before-publish.json').read_text())
          if tag.get('object', {}).get('type') != 'commit' or tag['object']['sha'] != os.environ['GITHUB_SHA']:
              raise SystemExit('Release tag changed; leaving the verified draft unpublished.')
          PY
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
      - name: Remove private signing file
        if: always()
        run: |
          if [[ -n "${PUSHOK_ANDROID_KEYSTORE_FILE:-}" ]]; then
            rm -f -- "$PUSHOK_ANDROID_KEYSTORE_FILE"
            rmdir -- "$(dirname "$PUSHOK_ANDROID_KEYSTORE_FILE")"
          fi
      - name: Upload release diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pushok-flow-release-diagnostics
          path: release-diagnostics/
          if-no-files-found: warn
          retention-days: 14
