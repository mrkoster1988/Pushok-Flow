name: Verify the Dart dependency baseline

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify the committed Dart dependency lockfile
        run: |
          set -euo pipefail
          flutter pub get --enforce-lockfile
          git diff --exit-code -- pubspec.lock
      - name: Preserve the exact lockfile and resolved dependency graph
        run: python3 tools/capture_dart_dependencies.py --output dart-dependency-baseline
      - name: Upload the dependency baseline for review
        uses: actions/upload-artifact@v4
        with:
          name: pushok-flow-dart-dependency-baseline
          path: dart-dependency-baseline/
          if-no-files-found: error
          retention-days: 30
