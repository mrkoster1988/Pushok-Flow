name: Pushok Flow for iPhone
on:
  push:
    paths:
      - 'ios/**'
      - '.github/workflows/iphone-build.yml'
      - 'assets/mascot/pushok.png'
      - 'pubspec.yaml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  archive:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.19.13'
          cache: false
      - name: Install XcodeGen
        run: command -v xcodegen || brew install xcodegen
      - name: Prepare WireGuard and Xcode project
        run: bash ios/prepare.sh
      - name: Archive for a physical iPhone
        run: |
          xcodebuild -project ios/PushokFlow.xcodeproj -scheme PushokFlow \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/PushokFlow.xcarchive" CODE_SIGNING_ALLOWED=NO archive
      - name: Verify device binaries and embedded provider
        run: |
          archive="$RUNNER_TEMP/PushokFlow.xcarchive"
          app="$archive/Products/Applications/PushokFlow.app"
          ext="$app/PlugIns/PacketTunnel.appex"
          for target in "$app" "$ext"; do
            binary=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$target/Info.plist")
            lipo -verify_arch arm64 "$target/$binary"
            xcrun vtool -show-build "$target/$binary" | grep -Eq 'platform +IOS$'
          done
          test "$(/usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionPointIdentifier' "$ext/Info.plist")" = com.apple.networkextension.packet-tunnel
          ditto -c -k --keepParent "$archive" "$RUNNER_TEMP/PushokFlow-iPhone-unsigned.xcarchive.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: PushokFlow-iPhone-unsigned-xcarchive
          path: ${{ runner.temp }}/PushokFlow-iPhone-unsigned.xcarchive.zip
          if-no-files-found: error
          retention-days: 30
