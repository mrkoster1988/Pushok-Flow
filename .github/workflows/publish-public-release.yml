name: Publish verified Pushok Flow update

on:
  push:
    branches: [main]
    paths:
      - 'release-requests/flow-v*-publish'
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Tracked release version, for example 0.27.0'
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: pushok-flow-android-release
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'mrkoster1988/Pushok-Flow' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    env:
      RELEASE_CERTIFICATE: 8b4114881116a920c3351b503052ac27078fdbbfcae1ace27f1af8245ebb7047
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resolve the requested version
        env:
          REQUESTED_VERSION: ${{ inputs.release_version }}
        run: |
          python3 - <<'PYVERSION'
          import os, re
          from pathlib import Path
          version = os.environ.get('REQUESTED_VERSION') or re.search(
              r'(?m)^version: (\d+\.\d+\.\d+)\+\d+$', Path('pubspec.yaml').read_text())[1]
          if not re.fullmatch(r'\d+\.\d+\.\d+', version):
              raise SystemExit('Invalid release version')
          if not Path(f'release-requests/flow-v{version}-publish').is_file() and not os.environ.get('REQUESTED_VERSION'):
              raise SystemExit('The current version has no publication request')
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              print('RELEASE_VERSION=' + version, file=output)
          PYVERSION
      - name: Validate tracked staging, successful CI and current public channel
        id: approved
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/publish_public_release.py preflight --release-version "$RELEASE_VERSION"
      - name: Check out the exact tested application source
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.approved.outputs.source_sha }}
          path: verified-source
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Download and restore the exact locally signed public APKs
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.approved.outputs.artifact_id }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" > "$RUNNER_TEMP/approved-candidate.zip"
          python3 tools/restore_public_release.py --staging "release-staging/v$RELEASE_VERSION.json" \
            --candidate-zip "$RUNNER_TEMP/approved-candidate.zip" --output-dir dist
      - name: Verify signature, exact package and all update assets
        env:
          RELEASE_APK: ${{ steps.approved.outputs.release_apk }}
        run: |
          set -euo pipefail
          flow_tools="$ANDROID_HOME/build-tools/37.0.0"
          test -x "$flow_tools/apksigner"
          test -x "$flow_tools/aapt"
          export PATH="$flow_tools:$PATH"
          export LD_LIBRARY_PATH="$flow_tools/lib64${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          python3 - <<'PY' 2>&1 | tee release-diagnostics/apk-validation.log
          import os
          from pathlib import Path
          import subprocess
          import sys
          sys.path.insert(0, 'tools')
          from restore_public_release import read_staging, release_payloads, verification_name
          version = os.environ['RELEASE_VERSION']
          document = read_staging(Path('release-staging') / ('v'+version+'.json'), version)
          for abi, _, payload in release_payloads(document):
              apk = Path('dist') / payload['release']['apkName']
              subprocess.run(['zipalign', '-c', '-P', '16', '4', str(apk)], check=True)
              command = ['python3', 'verified-source/tools/verify_release_apk.py', str(apk),
                  '--pubspec', 'verified-source/pubspec.yaml',
                  '--expected-certificate-sha256', os.environ['RELEASE_CERTIFICATE'],
                  '--output', str(Path('dist') / verification_name(abi))]
              if abi is not None:
                  command.extend(['--abi', abi])
              subprocess.run(command, check=True)
          command = ['python3', 'verified-source/tools/create_update_manifest.py',
              '--apk', 'dist/'+document['release']['apkName'], '--pubspec', 'verified-source/pubspec.yaml',
              '--verified', 'dist/verified-release.json', '--output', 'dist']
          if document['schemaVersion'] == 2:
              command.extend(['--variants-dir', 'dist'])
          subprocess.run(command, check=True)
          PY
          python3 tools/publish_public_release.py verify-assets --release-version "$RELEASE_VERSION"
      - name: Preserve verified public files
        uses: actions/upload-artifact@v4
        with:
          name: pushok-flow-verified-public-release
          path: dist/
          if-no-files-found: error
          retention-days: 30
      - name: Create a new draft, verify uploaded assets and publish latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/publish_public_release.py publish --release-version "$RELEASE_VERSION"
      - name: Verify the public updater endpoint without credentials
        run: python3 tools/publish_public_release.py verify-public --release-version "$RELEASE_VERSION"
      - name: Verify public release discovery and the version-specific manifest
        run: python3 tools/publish_public_release.py verify-discovery --release-version "$RELEASE_VERSION"
      - name: Verify every public APK and checksum without credentials
        run: python3 tools/publish_public_release.py verify-downloads --release-version "$RELEASE_VERSION"
      - name: Preserve publication diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pushok-flow-public-release-diagnostics
          path: release-diagnostics/
          if-no-files-found: warn
          retention-days: 14
