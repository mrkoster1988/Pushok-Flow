name: Android debug APK (unverified on device)
on:
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'config/route_recommendations.json'
      - 'updates/route-recommendations.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Capture Flutter environment
        run: |
          set -o pipefail
          mkdir -p diagnostics
          flutter --version | tee diagnostics/flutter-version.txt
          flutter doctor -v | tee diagnostics/flutter-doctor.txt
      - name: Source checks
        run: python -m unittest discover -s tests -v
      - name: Generate Android project and integrate WireGuard bridge
        run: |
          set -o pipefail
          bash tools/bootstrap_android.sh 2>&1 | tee diagnostics/bootstrap.log
      - name: Install dependencies
        run: |
          set -euo pipefail
          flutter pub get --enforce-lockfile
          git diff --exit-code -- pubspec.lock
      - name: Preserve resolved Dart dependencies
        run: python3 tools/capture_dart_dependencies.py --output diagnostics/dart-dependencies
      - name: Ensure Android tooling is installed
        run: |
          test -n "${ANDROID_HOME:-}"
          test -d "$ANDROID_HOME/build-tools"
          java -version
      - name: Install pinned Kotlin CLI for executable route tests
        run: |
          set -euo pipefail
          KOTLIN_VERSION=2.2.21
          curl --fail --location --retry 3 \
            "https://github.com/JetBrains/kotlin/releases/download/v${KOTLIN_VERSION}/kotlin-compiler-${KOTLIN_VERSION}.zip" \
            --output /tmp/pushok-kotlin.zip
          mkdir -p "$RUNNER_TEMP/pushok-kotlin"
          unzip -q /tmp/pushok-kotlin.zip -d "$RUNNER_TEMP/pushok-kotlin"
          echo "$RUNNER_TEMP/pushok-kotlin/kotlinc/bin" >> "$GITHUB_PATH"
      - name: Validate Kotlin routing logic
        run: |
          set -euo pipefail
          kotlinc -version
          bash tools/check_kotlin_routing.sh
      - name: Static analysis
        run: |
          set -o pipefail
          flutter analyze lib --no-pub 2>&1 | tee diagnostics/flutter-analyze.log
      - name: Flutter widget tests
        run: |
          set -o pipefail
          flutter test --reporter expanded --no-pub 2>&1 | tee diagnostics/flutter-test.log
      - name: Validate app manifest before merge
        run: |
          python tools/check_android_manifest.py
      - name: Compile Kotlin and Android manifest
        run: |
          set -o pipefail
          (cd android && ./gradlew --stacktrace :app:compileDebugKotlin :app:processDebugMainManifest) 2>&1 | tee diagnostics/gradle-compile.log
      - name: Build debug APK (test use only)
        run: |
          set -o pipefail
          flutter build apk --debug --no-pub -v 2>&1 | tee diagnostics/flutter-build.log
      - name: Confirm APK exists
        run: test -s build/app/outputs/flutter-apk/app-debug.apk
      - name: Validate APK package name, INTERNET permission and VPN service
        run: |
          set -euo pipefail
          python tools/verify_android_apk.py build/app/outputs/flutter-apk/app-debug.apk 2>&1 | tee diagnostics/apk-validation.log
      - name: Record APK checksum
        run: sha256sum build/app/outputs/flutter-apk/app-debug.apk | tee diagnostics/apk-sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: pushok-flow-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7
      - name: Upload diagnostics (including on failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pushok-flow-android-build-diagnostics
          path: diagnostics/
          if-no-files-found: warn
          retention-days: 7
