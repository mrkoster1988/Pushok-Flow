name: Source contract checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: python -m unittest discover -s tests -v
      - name: Verify signed recommendation data without private keys
        run: >-
          python tools/route_recommendations.py verify
          --envelope updates/route-recommendations.json
          --payload config/route_recommendations.json
          --certificate config/route-recommendations-certificate.pem
  flutter-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true
      - run: |
          set -euo pipefail
          flutter pub get --enforce-lockfile
          git diff --exit-code -- pubspec.lock
      - name: Preserve resolved Dart dependencies
        run: python3 tools/capture_dart_dependencies.py --output dart-dependency-diagnostics
      - name: Upload resolved Dart dependencies
        uses: actions/upload-artifact@v4
        with:
          name: pushok-flow-source-dart-dependencies
          path: dart-dependency-diagnostics/
          if-no-files-found: error
          retention-days: 30
      - name: Audit Dart package versions
        run: flutter pub outdated || true
      - run: flutter analyze lib test --no-pub
      - run: flutter test --no-pub
