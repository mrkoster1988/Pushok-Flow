name: PushokFlow
options:
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "${MARKETING_VERSION}"
    CURRENT_PROJECT_VERSION: "${CURRENT_PROJECT_VERSION}"
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTED_PLATFORMS: iphoneos
    SUPPORTS_MACCATALYST: NO
    FLOW_APP_ID: shop.pushok.flow
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_ENTITLEMENTS: Shared/Flow.entitlements
    LIBRARY_SEARCH_PATHS: ['$(inherited)', '$(SRCROOT)/.build/bridge']
packages:
  WireGuardKit:
    path: .build/wireguard-apple
targets:
  PushokFlow:
    type: application
    platform: iOS
    sources:
      - App
      - Shared/Profile.swift
      - Shared/Traffic.swift
      - .build/parser
      - path: ../assets/mascot/pushok.png
        buildPhase: resources
      - path: .build/WireGuard-License.txt
        buildPhase: resources
    dependencies:
      - package: WireGuardKit
      - target: PacketTunnel
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(FLOW_APP_ID)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: .build/App.plist
      properties:
        CFBundleDisplayName: Pushok Flow
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        FlowKeychainGroup: $(AppIdentifierPrefix)$(FLOW_APP_ID).profiles
        LSApplicationQueriesSchemes: [tg]
        NSCameraUsageDescription: Камера считывает QR-код профиля WireGuard или подписки Pushok.
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
  PacketTunnel:
    type: app-extension
    platform: iOS
    sources: [Tunnel, Shared/Profile.swift, Shared/Traffic.swift, .build/parser]
    dependencies:
      - package: WireGuardKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(FLOW_APP_ID).PacketTunnel
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
    info:
      path: .build/Tunnel.plist
      properties:
        CFBundleDisplayName: Pushok Flow Tunnel
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        FlowKeychainGroup: $(AppIdentifierPrefix)$(FLOW_APP_ID).profiles
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.packet-tunnel
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PacketTunnelProvider
schemes:
  PushokFlow:
    build:
      targets:
        PushokFlow: all
